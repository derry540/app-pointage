name: Build Android APK (ThermoPoint Pro)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Kotlin to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          SDKMANAGER=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0" || "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Ensure debug.keystore exists
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env and Firebase configuration exist
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8" standalone="no"?>' \
              '<resources>' \
              '    <string name="firestore_database_id" translatable="false">ai-studio-android-thermopo-b31fd8f6-6446-4bee-a6ef-ebfca232e847</string>' \
              '    <string name="recaptcha_site_key" translatable="false">6LeIwQsuAAAAAOT441rGdQHQ6FnhasHYUCe8rm7p</string>' \
              '</resources>' > app/src/main/res/values/firebase_applet_config.xml
          fi
          if ! grep -q "default_web_client_id" app/src/main/res/values/*.xml 2>/dev/null && ! grep -q '"client_type": 3' app/google-services.json 2>/dev/null; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8" standalone="no"?>' \
              '<resources>' \
              '    <string name="default_web_client_id" translatable="false">723634359894-av7rq6vf7um0t0opmtep8updr4qqo14a.apps.googleusercontent.com</string>' \
              '</resources>' > app/src/main/res/values/google_services_fallback.xml
          fi

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload ThermoPoint-Pro APK Artifact (Android)
        uses: actions/upload-artifact@v4
        with:
          name: ThermoPoint-Pro-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload ThermoPoint-Pro iPhone / iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermoPoint-Pro-iPhone-iOS-App
          path: ThermoPoint_Pro_iPhone_iOS.html
          if-no-files-found: warn