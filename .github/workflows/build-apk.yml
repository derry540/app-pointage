name: Build Android APK (ThermoPoint Pro)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Kotlin to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          SDKMANAGER=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0" || "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Ensure debug.keystore exists
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload ThermoPoint-Pro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermoPoint-Pro-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
